<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fruit slice game</title>
  <style>
    #motion-debug { position: fixed; bottom: 8px; left: 8px; right: 8px; z-index: 100; width: fit-content; max-width: calc(100vw - 16px); padding: 8px; border-radius: 8px; background: rgba(0,0,0,.85); color: white; font-size: 13px; }
    #motion-debug button { padding: 8px; margin: 3px; cursor: pointer; }
    #motion-debug-status { display: block; }
    body {
      margin: 0;
      font-family: sans-serif;
      overflow: hidden;
      background: black;
    }
    .screen {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: black;
    }
    .video-container {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100vh * 4 / 3);
      height: 100vh;
      background: black;
      overflow: hidden;
    }
    .video-container video,
    .video-container canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .video-container video {
      transform: scaleX(-1);
    }
    #start-fruit {
      position: absolute;
      top: 20%;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
    }
    #start-text {
      position: absolute;
      top: 45%;
      width: 100%;
      text-align: center;
      color: #fff;
      font-size: 5vh;
      background: rgba(0, 64, 0, 0.6);
      padding: 1vh;
      box-sizing: border-box;
    }
    #instruction-text {
      position: absolute;
      top: 45%;
      width: 100%;
      text-align: center;
      color: #fff;
      font-size: 5vh;
      background: rgba(0, 64, 0, 0.6);
      padding: 1vh;
      box-sizing: border-box;
    }
    #game-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    /* A separate transparent layer keeps hand trails above every information panel. */
    .hand-overlay {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100vh * 4 / 3);
      height: 100vh;
      z-index: 10;
      pointer-events: none;
    }
    .run-time { margin-left: 0.6em; white-space: nowrap; }
    #results-layout {
      position: absolute;
      top: 4vh;
      left: 4vw;
      width: min(46vw, 640px);
      color: white;
      pointer-events: none;
    }
    #leaderboard-panel {
      background: rgba(0, 32, 16, 0.88);
      border: 1px solid rgba(166, 255, 186, 0.4);
      border-radius: 2vh;
      padding: 2vh 2vw;
    }
    #level-finished { font-size: 4.5vh; font-weight: 700; text-align: center; margin: 0 0 3vh; }
    #leaderboard-panel table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 3vh; font-variant-numeric: tabular-nums; }
    #leaderboard-panel th, #leaderboard-panel td { padding: 0.7vh 0.6vw; text-align: left; border-bottom: 1px solid #315341; }
    #leaderboard-panel th:first-child { width: 18%; }
    #leaderboard-panel th:last-child { width: 34%; }
    #leaderboard-panel td:last-child, #leaderboard-panel th:last-child { text-align: right; }
    #leaderboard-panel td { overflow-wrap: anywhere; }
    .current-result { background: #bcff65; color: #102314; font-weight: bold; }
    #leaderboard-panel .current-result td { padding-top: 2vh; padding-bottom: 2vh; border: 0; }
    #current-rank { font-size: 7vh; line-height: 1.1; }
    #final-score { font-size: 10vh; line-height: 1.1; }
    #continue-fruit { position: absolute; top: 23vh; left: 68%; transform: translateX(-50%); pointer-events: none; }
    #continue-text { position: absolute; top: 43vh; left: 51%; width: 38%; text-align: center; color: #bcff65; font-weight: 700; font-size: 4.5vh; visibility: hidden; background: rgba(0, 32, 16, 0.72); padding: 1.5vh 1vw; border-radius: 2vh; box-sizing: border-box; pointer-events: none; }
    #next-level-info { position: absolute; top: 60vh; left: 51%; width: 38%; box-sizing: border-box; padding: 2vh 1vw; border-radius: 2vh; background: rgba(0, 32, 16, 0.88); color: white; text-align: center; pointer-events: none; }
    #next-level-label { display: block; font-size: 3.8vh; margin-bottom: 2vh; }
    #new-fruit-box { display: none; align-items: center; justify-content: center; gap: 1.5vw; font-size: 3.8vh; }
    #new-fruit-description { display: block; margin-bottom: 0.5vh; }
    @media (max-aspect-ratio: 3/4) {
      #results-layout { top: 2vh; left: 4vw; width: 92vw; }
      #level-finished { font-size: 3.5vh; margin-bottom: 2vh; }
      #leaderboard-panel table { font-size: 2.2vh; }
      #leaderboard-panel th, #leaderboard-panel td { padding: 0.35vh 1vw; }
      #current-rank { font-size: 5vh; }
      #final-score { font-size: 7vh; }
      #leaderboard-panel .current-result td { padding-top: 1.2vh; padding-bottom: 1.2vh; }
      #continue-fruit { top: 55vh; left: 58%; max-height: 14vh; width: auto !important; }
      #continue-text { top: 70vh; left: 8%; width: 84%; font-size: 3.5vh; }
      #next-level-info { top: 77vh; left: 8%; width: 84%; padding: 1.5vh 2vw; }
      #next-level-label { font-size: 3vh; margin-bottom: 1vh; }
      #new-fruit-box { font-size: 3vh; }
      #new-fruit-img { max-height: 7vh; width: auto !important; }
    }
    #hud {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 1vh 3vh 1vh 1vh;
      box-sizing: border-box;
      color: #fff;
      font-size: 4vh;
      display: flex;
      justify-content: space-between;
    }
    #hud span {
      background: rgba(0, 64, 0, 0.6);
      padding: 0.5vh 1vh;
      border-radius: 1vh;
    }
  </style>

</head>
<body>
  <aside id="motion-debug" aria-label="Временная диагностика движения">
    <strong>Диагностика движения</strong>
    <button id="motion-debug-toggle" type="button">Начать новую запись</button>
    <button id="motion-debug-download" type="button" disabled>Скачать лог JSON</button>
    <span id="motion-debug-status" role="status"></span>
  </aside>
  <section id="start-screen" class="screen"><div class="video-container"><video id="intro-video" autoplay muted playsinline></video><canvas id="intro-canvas"></canvas></div>
    <div id="instruction-text">Enable webcam and show hands — they control the game.</div>
    <div id="start-text">Slice the fruit by hand to play</div>
    <img id="start-fruit" alt="Start">
  </section>

  <section id="game-screen" class="screen"><div class="video-container"><video id="game-video" autoplay muted playsinline></video><canvas id="game-canvas"></canvas></div><div id="hud"><span id="timer"></span><span id="score"></span></div></section>

  <section id="complete-screen" class="screen">
    <div class="video-container">
      <video id="complete-video" autoplay muted playsinline></video>
      <canvas id="complete-canvas"></canvas>
    </div>
    <div id="results-layout">
      <div id="leaderboard-panel" aria-live="polite">
        <h2 id="level-finished"></h2>
        <table aria-label="Ranking of the last ten runs for this level">
          <thead><tr><th scope="col">Place</th><th scope="col">Run</th><th scope="col">Score</th></tr></thead>
          <tbody id="leaderboard-rows"></tbody>
        </table>
      </div>
    </div>
    <div id="continue-text">Slice to continue</div>
    <img id="continue-fruit" alt="Slice the watermelon to continue">
    <div id="next-level-info">
      <strong id="next-level-label"></strong>
      <div id="new-fruit-box">
        <img id="new-fruit-img" alt="">
        <div><span id="new-fruit-description"></span><span id="new-fruit-score"></span></div>
      </div>
    </div>
  </section>

  <!-- External libraries for pose detection -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>

  <script type="module">
    import { initMotionDebugPanel } from './js/motionDebug.js';
    initMotionDebugPanel();
    import ModeManager from './js/modeManager.js';
    import StartMode from './js/startMode.js';
    import GameMode from './js/gameMode.js';
    import LevelCompleteMode from './js/levelCompleteMode.js';

    const manager = new ModeManager();
    const start = new StartMode(manager);
    const game = new GameMode(manager);
    const complete = new LevelCompleteMode(manager);

    manager.register('start', start);
    manager.register('game', game);
    manager.register('complete', complete);

    manager.switchTo('start');
  </script>
</body>
</html>
