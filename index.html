<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fruit slice game</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      overflow: hidden;
      background: black;
    }
    .screen {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: black;
    }
    .video-container {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100vh * 4 / 3);
      height: 100vh;
      background: black;
      overflow: hidden;
    }
    .video-container video,
    .video-container canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .video-container video {
      transform: scaleX(-1);
    }
    #start-fruit {
      position: absolute;
      top: 20%;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
    }
    #start-text {
      position: absolute;
      top: 45%;
      width: 100%;
      text-align: center;
      color: #fff;
      font-size: 5vh;
      background: rgba(0, 64, 0, 0.6);
      padding: 1vh;
      box-sizing: border-box;
    }
    #instruction-text {
      position: absolute;
      top: 45%;
      width: 100%;
      text-align: center;
      color: #fff;
      font-size: 5vh;
      background: rgba(0, 64, 0, 0.6);
      padding: 1vh;
      box-sizing: border-box;
    }
    #game-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    #results-layout {
      position: absolute;
      top: 4vh;
      left: 4vw;
      width: min(46vw, 640px);
      color: white;
      pointer-events: none;
    }
    #leaderboard-panel {
      background: rgba(0, 32, 16, 0.88);
      border: 1px solid rgba(166, 255, 186, 0.4);
      border-radius: 2vh;
      padding: 2vh 2vw;
    }
    #level-finished { font-size: 2.2vh; color: #bcff65; margin-bottom: 1vh; }
    #leaderboard-panel h2 { margin: 0 0 1vh; font-size: 3.5vh; }
    #leaderboard-note { font-size: 1.6vh; margin: 0 0 1.5vh; color: #c4d6ca; }
    #leaderboard-panel table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 2vh; font-variant-numeric: tabular-nums; }
    #leaderboard-panel th, #leaderboard-panel td { padding: 0.65vh 0.6vw; text-align: left; border-bottom: 1px solid #315341; }
    #leaderboard-panel th:first-child { width: 18%; }
    #leaderboard-panel th:last-child { width: 28%; }
    #leaderboard-panel td:last-child, #leaderboard-panel th:last-child { text-align: right; }
    #leaderboard-panel td { overflow-wrap: anywhere; }
    .current-result { background: #bcff65; color: #102314; font-weight: bold; }
    #leaderboard-panel .current-result td { padding-top: 2vh; padding-bottom: 2vh; border: 0; }
    #current-rank, #final-score { font-size: 6vh; line-height: 1.1; }
    .current-result td:nth-child(2) { font-size: 2.5vh; }
    #continue-fruit { position: absolute; top: 34vh; left: 68%; transform: translateX(-50%); pointer-events: none; }
    #continue-text { position: absolute; top: 47vh; left: 53%; width: 34%; text-align: center; color: white; font-size: 2.5vh; visibility: hidden; padding: 1.5vh 1vw; box-sizing: border-box; border-radius: 1vh; background: rgba(0, 32, 16, 0.88); }
    #continue-text strong { display: block; font-size: 3.2vh; margin-bottom: 1vh; color: #bcff65; }
    #new-fruit-box { position: absolute; top: 63vh; left: 53%; width: 34%; box-sizing: border-box; display: none; align-items: center; justify-content: center; gap: 1vw; padding: 1.5vh 1vw; border-radius: 1vh; background: rgba(0, 32, 16, 0.88); color: white; font-size: 2.2vh; pointer-events: none; }
    #new-fruit-box strong { display: block; margin-bottom: 0.5vh; }
    @media (max-aspect-ratio: 3/4) {
      #results-layout { top: 2vh; left: 4vw; width: 92vw; }
      #leaderboard-panel h2 { font-size: 2.5vh; }
      #leaderboard-note { font-size: 1.4vh; }
      #leaderboard-panel table { font-size: 1.6vh; }
      #leaderboard-panel th, #leaderboard-panel td { padding: 0.35vh 1vw; }
      #current-rank, #final-score { font-size: 4.5vh; }
      #leaderboard-panel .current-result td { padding-top: 1.2vh; padding-bottom: 1.2vh; }
      #continue-fruit { top: 62vh; left: 58%; }
      #continue-text { top: 74vh; left: 8%; width: 84%; font-size: 2vh; }
      #continue-text strong { font-size: 2.5vh; }
      #new-fruit-box { top: 86vh; left: 8%; width: 84%; font-size: 1.8vh; }
    }
    #hud {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 1vh 3vh 1vh 1vh;
      box-sizing: border-box;
      color: #fff;
      font-size: 4vh;
      display: flex;
      justify-content: space-between;
    }
    #hud span {
      background: rgba(0, 64, 0, 0.6);
      padding: 0.5vh 1vh;
      border-radius: 1vh;
    }
  </style>

</head>
<body>
  <section id="start-screen" class="screen"><div class="video-container"><video id="intro-video" autoplay muted playsinline></video><canvas id="intro-canvas"></canvas></div>
    <div id="instruction-text">Enable webcam and show hands — they control the game.</div>
    <div id="start-text">Slice the fruit by hand to play</div>
    <img id="start-fruit" alt="Start">
  </section>

  <section id="game-screen" class="screen"><div class="video-container"><video id="game-video" autoplay muted playsinline></video><canvas id="game-canvas"></canvas></div><div id="hud"><span id="timer"></span><span id="score"></span></div></section>

  <section id="complete-screen" class="screen">
    <div class="video-container">
      <video id="complete-video" autoplay muted playsinline></video>
      <canvas id="complete-canvas"></canvas>
    </div>
    <div id="results-layout">
      <div id="leaderboard-panel" aria-live="polite">
        <div id="level-finished"></div>
        <h2>Level leaderboard</h2>
        <p id="leaderboard-note"></p>
        <table aria-label="Ranking of the last ten runs for this level">
          <thead><tr><th scope="col">Place</th><th scope="col">Run</th><th scope="col">Score</th></tr></thead>
          <tbody id="leaderboard-rows"></tbody>
        </table>
      </div>
    </div>
    <div id="continue-text"><strong id="next-level-label"></strong>Slice the watermelon with your hand to start the next level.</div>
    <img id="continue-fruit" alt="Continue">
    <div id="new-fruit-box">
      <img id="new-fruit-img" alt="New">
      <div><strong>New fruit in the next level</strong><span id="new-fruit-score"></span></div>
    </div>
  </section>

  <!-- External libraries for pose detection -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>

  <script type="module">
    import ModeManager from './js/modeManager.js';
    import StartMode from './js/startMode.js';
    import GameMode from './js/gameMode.js';
    import LevelCompleteMode from './js/levelCompleteMode.js';

    const manager = new ModeManager();
    const start = new StartMode(manager);
    const game = new GameMode(manager);
    const complete = new LevelCompleteMode(manager);

    manager.register('start', start);
    manager.register('game', game);
    manager.register('complete', complete);

    manager.switchTo('start');
  </script>
</body>
</html>
